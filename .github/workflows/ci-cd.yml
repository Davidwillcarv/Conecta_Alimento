name: CI/CD Pipeline - Conecta Alimentos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o Java 17 (mesma versão do seu projeto)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Compilar e testar o back-end usando o Maven Wrapper
      - name: Compilar com Maven (Backend)
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # 4. (Opcional) Testar build da imagem Docker
      - name: Testar Build do Dockerfile
        working-directory: ./backend
        run: docker build -t conecta-alimentos-backend:latest .